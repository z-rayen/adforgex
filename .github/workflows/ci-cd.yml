name: AdForge CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rayen
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FULL_IMAGE: ghcr.io/${{ github.repository_owner }}/adforge

jobs:

  # ══════════════════════════════════════════════════════════════════
  # JOB 1 — TEST BACKEND
  # ══════════════════════════════════════════════════════════════════
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Lint (syntax errors only)
        run: |
          pip install flake8
          flake8 backend/ llm/ rag/ scraper/ --count --select=E9,F63,F7,F82 --show-source

      - name: Run tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: test_secret_123
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests yet — skipping"

  # ══════════════════════════════════════════════════════════════════
  # JOB 2 — TEST FRONTEND
  # ══════════════════════════════════════════════════════════════════
  test-frontend:
    name: 🎨 Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend-react
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend-react
        run: npm run lint

      - name: Build frontend
        working-directory: frontend-react
        run: npm run build

  # ══════════════════════════════════════════════════════════════════
  # JOB 3 — BUILD AND PUSH DOCKER IMAGE
  # ══════════════════════════════════════════════════════════════════
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════
  # JOB 4 — DEPLOY TO STAGING (rayen branch)
  # ══════════════════════════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    if: false
    environment: staging

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.FULL_IMAGE }}:rayen
            cd /app/adforge
            docker compose down
            IMAGE_TAG=rayen docker compose up -d
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: sleep 20 && curl -f http://localhost:8000/health && echo "✅ Staging OK"

  # ══════════════════════════════════════════════════════════════════
  # JOB 5 — DEPLOY TO PRODUCTION (main branch)
  # ══════════════════════════════════════════════════════════════════
  deploy-production:
    name: 🌐 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: false
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.FULL_IMAGE }}:latest
            cd /app/adforge
            docker compose pull
            docker compose up -d --no-deps adforge
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: sleep 20 && curl -f http://localhost:8000/health && echo "✅ Production OK"
