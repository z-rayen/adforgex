version: "3.9"

x-common-env: &common-env
  GROQ_API_KEY: ${GROQ_API_KEY}
  CHROMA_DB_PATH: /data/chroma_db
  SQLITE_DB_PATH: /data/sqlite/adforge.db
  STATIC_FILES_PATH: ./frontend/dist
  TEXT_MODEL: llama-3.3-70b-versatile
  VISION_MODEL: meta-llama/llama-4-scout-17b-16e-instruct
  RAG_TOP_K: 5
  SCRAPE_TIMEOUT: 15
  JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}

services:

  # ── Main AdForge API + React frontend ───────────────────────────────────────
  adforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adforge_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      <<: *common-env
    volumes:
      - chroma_data:/data/chroma_db
      - sqlite_data:/data/sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - adforge_network

  # ── React dev server (local development only) ────────────────────────────────
  # Run with: docker compose --profile dev up
  frontend-dev:
    image: node:20-alpine
    container_name: adforge_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend-react:/app
      - /app/node_modules          # anonymous volume prevents overwriting node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - adforge
    networks:
      - adforge_network
    profiles:
      - dev                        # only starts with: docker compose --profile dev up

  # ── Nginx reverse proxy (production only) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: adforge_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      adforge:
        condition: service_healthy
    networks:
      - adforge_network
    profiles:
      - production

volumes:
  chroma_data:
    driver: local
  sqlite_data:
    driver: local

networks:
  adforge_network:
    driver: bridge